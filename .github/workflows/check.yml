name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate without import from derivation
        run: >-
          nix eval --json --option allow-import-from-derivation false
          .#checks --apply
          'all: builtins.mapAttrs (_: checks: builtins.mapAttrs (_: drv: drv.drvPath) checks) all'
      - run: nix flake check -L
      - run: nix build .# --out-link result-cli
      - run: nix build .#freecad --out-link result-freecad
      - run: nix build .#xvfb --out-link result-xvfb
      - run: python3 tests/native.py result-cli result-freecad
      - run: python3 tests/gui.py result-cli result-xvfb
      - run: python3 tests/artifacts.py result-cli result-freecad
      - run: python3 tests/capture.py result-cli
      - name: Rebuild native workbenches, geometry and release
        run: |
          purifier_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build --rebuild --no-link \
            ".#checks.$purifier_system.environment" \
            ".#checks.$purifier_system.project" \
            ".#checks.$purifier_system.release"
